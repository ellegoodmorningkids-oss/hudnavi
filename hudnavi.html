<title>HUDナビ</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--ac:#19e3ff;--ac2:#3dff8b;--dim:#71818e;--line:rgba(255,255,255,.10);--glass:rgba(255,255,255,.05)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;color:#fff;font-family:ui-rounded,"SF Pro Rounded",-apple-system,"Hiragino Sans",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(130% 100% at 50% -10%,#0b1620 0%,#03060a 55%,#000 100%)}
#app{height:100%;display:grid;grid-template-columns:1.12fr 1.05fr .83fr;grid-template-rows:1fr auto;gap:0 2.2vw;
  padding:max(2.2vh,env(safe-area-inset-top)) max(3vw,env(safe-area-inset-right)) max(1.5vh,env(safe-area-inset-bottom)) max(3vw,env(safe-area-inset-left))}
.col{display:flex;flex-direction:column;justify-content:center;min-width:0}
.lbl{font-size:calc(2.6vh*var(--fs,1));color:var(--dim);letter-spacing:.2em;font-weight:600}
/* turn card */
#turn{align-self:center;align-items:flex-start;background:linear-gradient(160deg,rgba(25,227,255,.10),rgba(255,255,255,.03) 55%);border:1px solid var(--line);border-radius:3.4vh;padding:2.2vh 2.2vw;box-shadow:0 0 5vh rgba(25,227,255,.07) inset}
#arrowwrap{height:22vh;width:22vh;margin-bottom:.6vh;color:var(--ac)}
#arrow{width:100%;height:100%;filter:drop-shadow(0 0 1.4vh rgba(25,227,255,.6))}
#tdist{font-size:calc(13.0vh*var(--fs,1));font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
#tdist small{font-size:calc(5.0vh*var(--fs,1));font-weight:600;margin-left:.8vh;color:var(--ac)}

#hwy.show{display:block}
#bk{width:100%;height:30vh;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#cfe0ea;font-size:calc(2.86vh*var(--fs,1));padding:1.2vh 1.4vw;resize:none;border-radius:0;outline:none;font-family:ui-monospace,Menlo,monospace}

<div id="map"></div>
<div id="app">

<script>

const R=6371000, rad=d=>d*Math.PI/180;

function fmtDist(m){
  if(m>=1000)return [ (m/1000).toFixed(m>=10000?0:1), 'km' ];
  const r=m>=200?Math.round(m/50)*50:Math.round(m/10)*10;
  return [String(Math.max(r,0)),'m'];
}
const MOD={'left':['左折',-90],'right':['右折',90],'slight left':['やや左方向',-45],'slight right':['やや右方向',45],
  'sharp left':['大きく左折',-135],'sharp right':['大きく右折',135],'straight':['直進',0],'uturn':['Uターン',180]};
function describe(m){
  if(!m)return ['--',0];
  const t=m.type,mod=m.modifier;
  if(t==='arrive')return [m.viaStop?'経由地':'目的地に到着',null];
  if(t==='roundabout'||t==='rotary'||t==='roundabout turn'){const e=(MOD[mod]||['',0]);return ['ロータリー '+(e[0]||''),e[1]||0];}
  const e=MOD[mod]||['直進',0];
  if(t==='merge')return ['合流 '+e[0],e[1]];
  if(t==='on ramp')return ['入口 '+e[0],e[1]];
  if(t==='off ramp')return ['出口 '+e[0],e[1]];
  if(t==='fork')return ['分岐 '+e[0],e[1]];
  if(t==='end of road')return [e[0],e[1]];
  return [e[0],e[1]];
}

/* ---------- ルート ---------- */
async function fetchRoutes(o,d,vl,alt){
  const pts=[o].concat(vl||[]).concat([d]).map(p=>p.lon+','+p.lat).join(';');
  const url='https://router.project-osrm.org/route/v1/driving/'+pts+'?overview=full&geometries=geojson&steps=true'+(alt&&!(vl&&vl.length)?'&alternatives=true':'');
  const r=await fetch(url);
  if(!r.ok)throw new Error('ルート計算に失敗しました');
  const j=await r.json();
  if(j.code!=='Ok'||!j.routes.length)throw new Error('ルートが見つかりません');
  return j.routes;
}
function setRoute(rt){
  route=rt;coords=rt.geometry.coordinates;cum=[0];
  for(let i=1;i<coords.length;i++)cum.push(cum[i-1]+hav(coords[i-1][1],coords[i-1][0],coords[i][1],coords[i][0]));
  const raw=[];
  rt.legs.forEach((l,li)=>l.steps.forEach((st,k)=>{
    const x={...st,maneuver:{...st.maneuver}};
    if(li<rt.legs.length-1&&k===l.steps.length-1&&x.maneuver.type==='arrive')x.maneuver.viaStop=true;
    raw.push(x);
  }));
  steps=[];
  for(const st of raw){
    const t=st.maneuver.type,md=st.maneuver.modifier;
    const trivial=(t==='depart'&&steps.length>0)||t==='new name'||t==='notification'||(t==='continue'&&(!md||md==='straight'))||(t==='turn'&&md==='straight');
    if(trivial&&steps.length){steps[steps.length-1]={...steps[steps.length-1],distance:steps[steps.length-1].distance+st.distance};}
    else steps.push({...st});
  }
  sigs=[];sigStep=-1;hw=[];hwFrom=-1;
  const sum=steps.reduce((s,x)=>s+x.distance,0)||1,tot=cum[cum.length-1];
  let acc=0;stepEnd=steps.map(s=>{acc+=s.distance;return acc*tot/sum;});
  lastIdx=0;offCount=0;spoken={};
  drawRoute();drawMarkers();
}

/* ---------- 進行計算 ---------- */
function project(lat,lon,from,to){
  let best={d:1e12,along:0,idx:from};
  const k=Math.cos(rad(lat));
  for(let i=from;i<Math.min(to,coords.length-1);i++){
    const ax=coords[i][0],ay=coords[i][1],bx=coords[i+1][0],by=coords[i+1][1];
    const px=(lon-ax)*k,py=lat-ay,vx=(bx-ax)*k,vy=by-ay;
    const L2=vx*vx+vy*vy;let t=L2?(px*vx+py*vy)/L2:0;t=Math.max(0,Math.min(1,t));
    const cx=ax+(bx-ax)*t,cy=ay+(by-ay)*t;
    const d=hav(lat,lon,cy,cx);
    if(d<best.d)best={d:d,along:cum[i]+t*(cum[i+1]-cum[i]),idx:i};
  }
  return best;
}
function pointAt(al){
  let i=0;while(i<cum.length-2&&cum[i+1]<al)i++;
  const seg=cum[i+1]-cum[i]||1,t=Math.min(1,Math.max(0,(al-cum[i])/seg));
  const a=coords[i],b=coords[i+1];
  const lat=a[1]+(b[1]-a[1])*t,lon=a[0]+(b[0]-a[0])*t;
  const hd=(Math.atan2((b[0]-a[0])*Math.cos(rad(lat)),b[1]-a[1])*180/Math.PI+360)%360;
  return {lat,lon,heading:hd};
}

  setArrow(nxt?ang:null,nxt?(dTurn<=100?2:dTurn<=250?1:0):0);

/* ---------- 信号カウント ---------- */
let sigs=[],sigStep=-1,sigBusy=false;
async function loadSignals(si){
  if(sigBusy||sigStep===si||!route)return;
  sigBusy=true;sigStep=si;sigs=[];
  try{
    const endAl=stepEnd[si],a0=endAl-800;
    let i0=0,i1=coords.length-1;
    for(let i=0;i<coords.length;i++){if(cum[i]<=a0-30)i0=i;}
    for(let i=coords.length-1;i>=0;i--){if(cum[i]>=endAl+30)i1=i;}
    if(i1<=i0){sigBusy=false;return;}
    let s=90,w=180,n=-90,e=-180;
    for(let i=i0;i<=i1;i++){const c=coords[i];s=Math.min(s,c[1]);n=Math.max(n,c[1]);w=Math.min(w,c[0]);e=Math.max(e,c[0]);}
    const pad=0.0004;
    const q='[out:json][timeout:8];node[highway=traffic_signals]('+(s-pad)+','+(w-pad)+','+(n+pad)+','+(e+pad)+');out;';
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});
    const j=await r.json();
    const list=[];
    for(const nd of j.elements||[]){
      const p=project(nd.lat,nd.lon,i0,i1);
      if(p.d<=18)list.push(p.along);
    }
    list.sort((x,y)=>x-y);
    const out=[];for(const a of list){if(!out.length||a-out[out.length-1]>30)out.push(a);}
    if(sigStep===si)sigs=out;
  }catch(e){}
  sigBusy=false;
}

/* ---------- 制限速度（自動） ---------- */
let lastLim={t:0,lat:0,lon:0},limBusy=false;
function effLimit(){return manualLimit>0?manualLimit:autoLimit;}
function renderLimit(){
  const L=effLimit(),el=$('limit');
  if(L){el.textContent=L;el.classList.remove('off');}
  else{el.textContent=manualLimit===0?'AUTO':'--';el.classList.add('off');}
  const gl=$('gl');
  if(L){gl.setAttribute('stroke-dashoffset',String(-(Math.min(L,120)/120*75-0.5)));gl.style.display='';}
  else gl.style.display='none';

async function fetchLimit(){
  if(!pos||limBusy)return;
  const now=Date.now();
  if(now-lastLim.t<12000)return;
  if(lastLim.lat&&now-lastLim.t<60000&&hav(lastLim.lat,lastLim.lon,pos.lat,pos.lon)<60)return;
  limBusy=true;lastLim={t:now,lat:pos.lat,lon:pos.lon};
  try{
    const q='[out:json][timeout:8];way(around:25,'+pos.lat+','+pos.lon+')[highway][maxspeed];out tags geom;';
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});
    const j=await r.json();
    let best=0,bd=1e9;
    for(const w of j.elements||[]){
      const m=parseInt(w.tags&&w.tags.maxspeed,10);if(!m||isNaN(m))continue;
      for(const g of w.geometry||[]){const d=hav(pos.lat,pos.lon,g.lat,g.lon);if(d<bd){bd=d;best=m;}}

  }catch(e){}

}

/* ---------- 昼夜 ---------- */
function sunTimes(lat,lon,d){
  const rd=Math.PI/180;
  const N=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,0))/864e5);
  const lh=lon/15,noon=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12).getTime();
  function calc(rising){
    const t=N+((rising?6:18)-lh)/24,M=0.9856*t-3.289;
    let L=M+1.916*Math.sin(M*rd)+0.020*Math.sin(2*M*rd)+282.634;L=(L%360+360)%360;
    let RA=Math.atan(0.91764*Math.tan(L*rd))/rd;RA=(RA%360+360)%360;
    RA+=(Math.floor(L/90)*90)-(Math.floor(RA/90)*90);RA/=15;
    const sinD=0.39782*Math.sin(L*rd),cosD=Math.cos(Math.asin(sinD));
    const cosH=(Math.cos(90.833*rd)-sinD*Math.sin(lat*rd))/(cosD*Math.cos(lat*rd));
    if(cosH>1||cosH<-1)return null;
    let H=rising?360-Math.acos(cosH)/rd:Math.acos(cosH)/rd;H/=15;
    let UT=H+RA-0.06571*t-6.622-lh;UT=(UT%24+24)%24;
    let ms=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())+UT*3600e3;
    while(ms<noon-12*3600e3)ms+=24*3600e3;while(ms>noon+12*3600e3)ms-=24*3600e3;
    return ms;
  }
  const a=calc(true),b=calc(false);
  return(a==null||b==null)?null:{rise:a,set:b};
}

/* ---------- 危険箇所（オービス・踏切） ---------- */
let haz=[],hazT=0,hazPos=null,hazBusy=false,hazWarned={};
function bearing(a,b,c,d){const y=Math.sin(rad(d-b))*Math.cos(rad(c));const x=Math.cos(rad(a))*Math.sin(rad(c))-Math.sin(rad(a))*Math.cos(rad(c))*Math.cos(rad(d-b));return (Math.atan2(y,x)*180/Math.PI+360)%360;}
async function fetchHazards(){
  if(!pos||hazBusy)return;
  const now=Date.now();
  if(now-hazT<20000)return;
  if(hazPos&&now-hazT<120000&&hav(hazPos.lat,hazPos.lon,pos.lat,pos.lon)<300)return;
  hazBusy=true;hazT=now;hazPos={lat:pos.lat,lon:pos.lon};
  try{
    const a='(around:1200,'+pos.lat+','+pos.lon+')';
    const q='[out:json][timeout:10];(node'+a+'[highway=speed_camera];node'+a+'[railway=level_crossing];);out;';
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});
    const j=await r.json();
    haz=(j.elements||[]).filter(e=>e.lat!=null).map(e=>({id:e.id,lat:e.lat,lon:e.lon,kind:(e.tags&&e.tags.highway==='speed_camera')?'cam':'rail'}));
  }catch(e){}
  hazBusy=false;
}
function showHazard(){
  const el=$('alert');
  if(!pos||!haz.length||(pos.speed||0)<2.5){el.classList.remove('show');return;}
  const hd=(pos.heading!=null&&!isNaN(pos.heading))?pos.heading:lastHd;
  let best=null;
  for(const h of haz){
    const d=hav(pos.lat,pos.lon,h.lat,h.lon);if(d>600)continue;
    const df=Math.abs(((bearing(pos.lat,pos.lon,h.lat,h.lon)-hd+540)%360)-180);
    if(df>40)continue;
    if(!best||d<best.d)best={h:h,d:d};
  }
  if(!best){el.classList.remove('show');return;}
  const label=best.h.kind==='cam'?'オービス':'踏切';
  const [v,u]=fmtDist(best.d);
  el.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>'+label+'　'+v+u+'先';
  el.classList.add('show');
  if(!hazWarned[best.h.id]&&best.d<500){hazWarned[best.h.id]=1;speak('この先、'+label+'があります');}
}

/* ---------- Gメーター（GPSからの推定） ---------- */
let gPrev=null,gx=0,gy=0,evA=0,evB=0,evC=0,lastEv=0;
function calcG(){
  if(pos&&pos.speed!=null&&pos.heading!=null&&!isNaN(pos.heading)){
    const now=Date.now();
    if(!gPrev||now-gPrev.t>=4000){gPrev={t:now,v:pos.speed,h:pos.heading};}
    else{
      const dt=(now-gPrev.t)/1000;
      if(dt>=0.4){
        const al=(pos.speed-gPrev.v)/dt/9.8;
        const dh=((pos.heading-gPrev.h+540)%360)-180;
        const la=pos.speed>2?pos.speed*rad(dh)/dt/9.8:0;
        gy=gy*0.6+al*0.4;gx=gx*0.6+la*0.4;
        const tn=Date.now();
        if(tn-lastEv>3000){
          if(gy>0.30){evA++;lastEv=tn;}else if(gy<-0.30){evB++;lastEv=tn;}else if(Math.abs(gx)>0.38){evC++;lastEv=tn;}
        }
        gPrev={t:now,v:pos.speed,h:pos.heading};
      }
    }
  }
  renderG();
}
function renderG(){
  if(!gEnabled)return;
  const c=v=>Math.max(-1,Math.min(1,v/0.5))*3.2;
  $('gdot').style.transform='translate('+c(gx).toFixed(2)+'vh,'+(-c(gy)).toFixed(2)+'vh)';
}
function toggleG(){
  gEnabled=!gEnabled;$('gball').classList.toggle('on',gEnabled);renderG();
  setStatus('Gメーター '+(gEnabled?'ON（GPSからの推定値）':'OFF'));closeSheet();
}

let wxT=0,wxPos=null,wxBusy=false,wxNow=null,wxDest=null,frostWarned=false,destWxFor='';
const WC={0:'快晴',1:'晴れ',2:'晴れ時々曇り',3:'曇り',45:'霧',48:'霧',51:'霧雨',53:'霧雨',55:'霧雨',56:'凍雨',57:'凍雨',61:'小雨',63:'雨',65:'大雨',66:'凍雨',67:'凍雨',71:'小雪',73:'雪',75:'大雪',77:'雪',80:'にわか雨',81:'にわか雨',82:'激しい雨',85:'にわか雪',86:'にわか雪',95:'雷雨',96:'雷雨',99:'雷雨'};
async function getWx(lat,lon){
  const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code&timezone=auto');
  const j=await r.json();return {t:j.current.temperature_2m,c:j.current.weather_code};
}
async function updateWx(){
  if(!pos||wxBusy)return;
  const now=Date.now(),dk=dest?dest.lat.toFixed(2)+','+dest.lon.toFixed(2):'',changed=dk!==destWxFor;
  if(!changed&&wxPos&&now-wxT<600000&&hav(wxPos.lat,wxPos.lon,pos.lat,pos.lon)<5000)return;
  if(!changed&&now-wxT<30000)return;
  wxBusy=true;wxT=now;wxPos={lat:pos.lat,lon:pos.lon};
  try{
    wxNow=await getWx(pos.lat,pos.lon);
    if(dest){destWxFor=dk;wxDest=await getWx(dest.lat,dest.lon);}else{wxDest=null;destWxFor='';}
    if(wxNow.t<=3&&!frostWarned){frostWarned=true;showNote('気温 '+Math.round(wxNow.t)+'℃　路面の凍結に注意',15000);speak('気温が低くなっています。路面の凍結に注意してください');}
    if(wxNow.t>6)frostWarned=false;
  }catch(e){}
  wxBusy=false;
}
let altS=null,altBuf=[];
function trackAlt(){
  if(!pos||pos.alt==null||isNaN(pos.alt))return;
  altS=altS==null?pos.alt:altS*0.7+pos.alt*0.3;
  const last=altBuf[altBuf.length-1];
  if(!last||trip-last.d>=25){altBuf.push({d:trip,a:altS});if(altBuf.length>40)altBuf.shift();}
}
function slopePct(){
  if(altS==null||altBuf.length<3)return null;
  const ref=altBuf.slice().reverse().find(x=>trip-x.d>=150);
  return ref?(altS-ref.a)/(trip-ref.d)*100:null;
}
function renderWx(){
  const l1=[];
  if(wxNow)l1.push('現在 '+Math.round(wxNow.t)+'℃ '+(WC[wxNow.c]||''));
  if(wxDest&&dest)l1.push('目的地 '+Math.round(wxDest.t)+'℃ '+(WC[wxDest.c]||''));
  $('wx1').textContent=l1.join('　／　');
  let l2='';
  if(altS!=null){l2='標高 '+Math.round(altS)+'m';const sp=slopePct();if(sp!=null&&Math.abs(sp)>=2.5)l2+='　'+(sp>0?'上り ':'下り ')+Math.abs(sp).toFixed(0)+'%';}
  $('wx2').textContent=l2;
  $('wx').classList.toggle('warn',!!(wxNow&&wxNow.t<=3));
}

/* ---------- 地図の事前保存 ---------- */
function lon2x(lon,z){return Math.floor((lon+180)/360*Math.pow(2,z));}
function lat2y(lat,z){const r=rad(lat);return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z));}
async function saveMapAlongRoute(){
  if(!route){$('shm').textContent='案内中ではありません';return;}
  if(!('caches' in window)){$('shm').textContent='この環境は保存に対応していません';return;}
  const set=new Set();
  for(const z of [12,13,14,15,16]){
    for(let i=0;i<coords.length;i+=(z>=15?1:2)){
      const x=lon2x(coords[i][0],z),y=lat2y(coords[i][1],z);
      for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)set.add(z+'/'+(x+dx)+'/'+(y+dy));
    }
  }
  let list=[...set];if(list.length>3000)list=list.slice(0,3000);
  closeSheet();
  try{
    const c=await caches.open('hud-tiles-v1');let n=0;
    for(let i=0;i<list.length;i+=6){
      await Promise.all(list.slice(i,i+6).map(async k=>{
        const u='https://cyberjapandata.gsi.go.jp/xyz/std/'+k+'.png';
        try{if(!(await c.match(u))){const r=await fetch(u);if(r.ok)await c.put(u,r);}}catch(e){}
        n++;
      }));
      setStatus('地図を保存中 '+n+' / '+list.length);
    }
    setStatus('地図を保存しました（'+list.length+'枚）');
  }catch(e){setStatus('地図の保存に失敗しました');}
}

/* ---------- 高速道路（出口・SA/PA） ---------- */
let hw=[],hwFrom=-1,hwBusy=false;
async function loadHwy(along){
  if(hwBusy||!route)return;
  hwBusy=true;hwFrom=along;
  try{
    const a1=along+25000;let i0=0,i1=coords.length-1;
    for(let i=0;i<coords.length;i++){if(cum[i]<=along-100)i0=i;}
    for(let i=coords.length-1;i>=0;i--){if(cum[i]>=a1)i1=i;}
    if(i1<=i0){hwBusy=false;return;}
    let s=90,w=180,n=-90,e=-180;
    for(let i=i0;i<=i1;i++){const c=coords[i];s=Math.min(s,c[1]);n=Math.max(n,c[1]);w=Math.min(w,c[0]);e=Math.max(e,c[0]);}
    const p=0.004,bb=(s-p)+','+(w-p)+','+(n+p)+','+(e+p);
    const q='[out:json][timeout:20];(node[highway=motorway_junction]('+bb+');nwr[highway=services]('+bb+');nwr[highway=rest_area]('+bb+'););out center;';
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});
    const j=await r.json();
    const out=[];
    for(const el of j.elements||[]){
      const la=el.lat!=null?el.lat:(el.center&&el.center.lat),lo=el.lon!=null?el.lon:(el.center&&el.center.lon);
      if(la==null)continue;
      const t=el.tags||{},name=t.name||t.ref||'';if(!name)continue;
      const kind=t.highway==='motorway_junction'?'jn':'sa';
      const pr=project(la,lo,i0,i1);
      if(pr.d<=(kind==='jn'?60:500))out.push({kind:kind,name:name,along:pr.along});
    }
    out.sort((x,y)=>x.along-y.along);hw=out;
  }catch(e){}
  hwBusy=false;
}
function renderHwy(along){
  const el=$('hwy');
  const onHwy=pos&&((autoLimit>=70)||((pos.speed||0)*3.6>=80));
  if(!route||!onHwy){el.classList.remove('show');return;}
  if(hwFrom<0||along-hwFrom>12000)loadHwy(along);
  const ahead=hw.filter(x=>x.along>along+100&&x.along-along<30000);
  const jn=ahead.find(x=>x.kind==='jn'),sa=ahead.find(x=>x.kind==='sa');
  const parts=[];
  if(jn){const [v,u]=fmtDist(jn.along-along);parts.push('次の出口　'+jn.name+'　'+v+u);}
  if(sa){const [v,u]=fmtDist(sa.along-along);parts.push('次のSA/PA　'+sa.name+'　'+v+u);}
  if(!parts.length){el.classList.remove('show');return;}
  el.textContent=parts.join('　｜　');el.classList.add('show');
}

async function loadNearby(c,list){
  if(!pos){list.innerHTML='';$('shm').textContent='現在地を取得できません';return;}
  list.innerHTML='';$('shm').textContent='検索中…';
  try{
    const cpt=(nearTarget==='dest'&&dest)?dest:pos;
    const q='[out:json][timeout:12];'+c[2].replace('nwr','nwr(around:3000,'+cpt.lat+','+cpt.lon+')')+';out center 80;';
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});
    const j=await r.json();
    const hd=(pos.heading!=null&&!isNaN(pos.heading))?pos.heading:null;
    const moving=(pos.speed||0)>2&&hd!=null;
    const arr=(j.elements||[]).map(e=>{
      const la=e.lat!=null?e.lat:(e.center&&e.center.lat),lo=e.lon!=null?e.lon:(e.center&&e.center.lon);
      if(la==null)return null;
      const t=e.tags||{};
      const name=t.name||t.brand||t.operator||(c[1]+'（名称なし）');
      const d=hav(cpt.lat,cpt.lon,la,lo);
      let dir='';
      if(moving&&cpt===pos){const df=Math.abs(((bearing(pos.lat,pos.lon,la,lo)-hd+540)%360)-180);dir=df<60?'前方':df>120?'後方':'横';}
      return {la,lo,name,d,dir,inf:tagInfo(t)};
    }).filter(Boolean).sort((x,y)=>x.d-y.d).slice(0,14);
    $('shm').textContent=arr.length?'':'3km以内に見つかりませんでした（地図データに未登録の可能性があります）';
    arr.forEach(x=>{
      const [v,u]=fmtDist(x.d);
      const btns=[['目的地',()=>startRoute({lat:x.la,lon:x.lo},x.name)]];
      if(x.inf.phone)btns.unshift(['電話',()=>{location.href='tel:'+x.inf.phone.replace(/[^\d+]/g,'');}]);
      if(route)btns.push(['経由地',()=>addVia({lat:x.la,lon:x.lo},x.name)]);
      addList(list,x.name,v+u+(x.dir?' ・ '+x.dir:'')+(x.inf.line?'\n'+x.inf.line:''),btns);
    });
  }catch(e){$('shm').textContent='検索に失敗しました（通信を確認してください）';}
}

/* ---------- ボタン ---------- */
function openSearch(mode){searchMode=mode;keepAwake();showMsg(mode==='via'?'経由地を検索してください':'');renderHome();$('ov').classList.add('show');setTimeout(()=>$('q').focus(),50);}
$('bSearch').onclick=()=>openSearch('dest');
$('q').addEventListener('input',()=>{if(!$('q').value.trim())renderHome();});
$('bClose').onclick=()=>{$('ov').classList.remove('show');searchMode='dest';};
$('bGo').onclick=search;
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
$('bMap').onclick=()=>{
  mapMode=!mapMode;
  if(mapMode&&!initMap()){mapMode=false;return;}
  document.body.classList.toggle('mapmode',mapMode);
  $('bMap').classList.toggle('on',mapMode);$('bMap').querySelector('span').textContent=mapMode?'HUD':'マップ';
  if(mapMode){setTimeout(()=>{map.resize();moveMap();},60);}
};
$('bVoice').onclick=()=>{
  voiceOn=!voiceOn;$('bVoice').querySelector('span').textContent=voiceOn?'音声 ON':'音声 OFF';$('bVoice').classList.toggle('on',voiceOn);
  if(voiceOn)speak('音声案内をオンにしました');
};
$('bStop').onclick=()=>{
  if(sim){clearInterval(sim);sim=null;demoUI(false);}
  saveLog('終了');
  route=null;dest=null;via=[];alts=[];coords=[];steps=[];drawRoute();drawMarkers();closeSheet();
  $('tdist').innerHTML='--<small>m</small>';$('tinstr').textContent='目的地を設定してください';$('tnext').textContent='';
  $('eta').textContent='--:--';$('rem').innerHTML='--<small>km</small>';$('remt').innerHTML='--<small>分</small>';
  setArrow(0);setStatus('案内を終了しました');
  if(window.speechSynthesis)speechSynthesis.cancel();
};
$('bNear').onclick=()=>{keepAwake();openNearby();};
$('bMenu').onclick=()=>{keepAwake();openMenu();};
$('zIn').onclick=()=>{zoomOff=Math.min(zoomOff+0.7,3);overviewUntil=0;setFree(false);moveMap();};
$('zMe').onclick=()=>{overviewUntil=0;setFree(false);moveMap();};
$('zOut').onclick=()=>{zoomOff=Math.max(zoomOff-0.7,-4);overviewUntil=0;setFree(false);moveMap();};
$('zFit').onclick=()=>{if(!route){setStatus('案内中ではありません');return;}toggleOverview();};
$('limit').onclick=()=>{
  const L=[0,30,40,50,60,80,100];manualLimit=L[(L.indexOf(manualLimit)+1)%L.length];renderLimit();
  if(manualLimit===0){lastLim.t=0;}
};
$('speed').onclick=()=>$('limit').click();

applyUi();setArrow(0);renderLimit();startGps();keepAwake();
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
</script>
